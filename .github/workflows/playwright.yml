name: Playwright Tests

on:
  push:
    branches: [main, master]

  pull_request:
    branches: [main, master]

jobs:
  test:
    timeout-minutes: 60
    runs-on: ubuntu-latest

    env:
      PLAYWRIGHT_SERVICE_URL: ${{ vars.PLAYWRIGHT_SERVICE_URL }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: lts/*

      - name: Install dependencies
        run: npm ci

      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      # Run AEPC scripts sequentially with one worker
      - name: Run AEPC tests - 1 Worker
        run: |
          npx playwright test tests/AEPCinitialversion.spec.js tests/AEPC.spec.js --config=playwright.service.config.js --workers=1

      # Run remaining tests in parallel with four workers
      - name: Run remaining Playwright tests - 4 Workers
        run: |
          npx playwright test --config=playwright.service.config.js --workers=4 --grep-invert "AEPCPublicPortal|AEPCPublicPortalPOM"

      # Upload the Playwright report
      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30