name: Playwright Tests

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test:
    timeout-minutes: 60
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: lts/*

      - name: Install dependencies
        run: npm ci

      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Run Playwright tests
        env:
          PLAYWRIGHT_SERVICE_URL: ${{ vars.PLAYWRIGHT_SERVICE_URL }}
        run: npx playwright test tests/AEPCinitialversion.spec.js --workers=1
      # Run all remaining test scripts in parallel
      - name: Run remaining Playwright tests
        run: npx playwright test --config=playwright.service.config.js --workers=4 --grep-invert "AEPCPublicPortal|AEPCPublicPortalPOM"
        # Run AEPC POM sequentially
      - name: Run AEPC POM
        run: npx playwright test tests/AEPC.spec.js --workers=1

      

      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30
